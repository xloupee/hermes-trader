[package]
name = "yellowstone-jet-sidecar"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
solana-keypair = "3"
solana-message = "3"
solana-pubkey = "3"
solana-signature = "3"
solana-signer = "3"
solana-system-interface = { version = "2", features = ["bincode"] }
solana-transaction = "3"
solana-hash = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
yellowstone-jet-tpu-client = { version = "0.3.1", default-features = false, features = ["yellowstone-grpc"] }
