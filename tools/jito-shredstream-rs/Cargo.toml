[package]
name = "jito-shredstream-rs"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "jito-feed-probe"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.5", features = ["derive", "env"] }
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-entry = "=2.2.1"
solana-hash = "2"
solana-message = "2"
solana-pubkey = "2"
solana-transaction = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14"
tonic-prost = "0.14"

[dev-dependencies]
base64 = "0.22"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
