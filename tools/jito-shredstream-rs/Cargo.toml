[package]
name = "jito-shredstream-rs"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "jito-feed-probe"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arc-swap = "1"
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
clap = { version = "4.5", features = ["derive", "env"] }
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-address-lookup-table-interface = "2"
solana-connection-cache = { version = "=2.2.1", default-features = false }
solana-entry = "=2.2.1"
solana-hash = "2"
solana-instruction = "2"
solana-keypair = "2"
solana-message = "2"
solana-pubkey = "2"
solana-quic-client = "=2.2.1"
solana-rpc-client = { version = "=2.2.1", default-features = false }
solana-signer = "2"
solana-tpu-client = { version = "=2.2.1", default-features = false }
solana-transaction = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
