[package]
name = "shredstream-rs"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bincode = "1.3.3"
clap = { version = "4.5", features = ["derive", "env"] }
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-entry = "=2.2.1"
solana-hash = "=2.2.1"
solana-message = { version = "=2.2.1", features = ["bincode"] }
solana-pubkey = "=2.2.1"
solana-signature = "=2.2.1"
solana-transaction = { version = "=2.2.1", features = ["bincode"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.13", features = ["tls-webpki-roots"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
