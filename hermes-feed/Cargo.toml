[package]
name = "hermes-feed"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Low-latency Robinhood Chain Nitro feed measurement probe"

[dependencies]
alloy-consensus = { version = "2.1.1", features = ["k256"] }
alloy-eips = "2.1.1"
alloy-primitives = { version = "1.6.0", features = ["serde"] }
alloy-sol-types = "1.6.0"
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
